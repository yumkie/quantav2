<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poiret+One&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="../img/logo2.png">
        <p>Quanta</p>
    </header>
    <main>
        <div class="profile_container">
            <div class="left_chart_container">
                <nav class="menu_container">
                    <a href="../html/friends.html">
                        <img src="../img/Component 5.svg">
                        <p>Friends</p>
                    </a>
                    <a href="../html/message.html">
                        <img src="../img/Component 8.svg">
                        <p>Message</p>
                    </a>
                </nav>
                <nav class="info">
                    <img src="../img/Edit.svg">
                    <nav>
                        <h1>More information</h1>
                        <img src="../img/Info.svg">
                    </nav>
                    <p>Friends:</p>
                    <p>Date of birth:</p>
                    <p>Hometown:</p>
                    <p>Languages:</p>
                    <p>Educational institution:</p>
                    <img src="../img/log out.svg">
                </nav>
            </div>
            <nav class="profile">
                <nav>
                    <img src="../img/ava.svg" width="220" height="213">
                    <nav class="profile_info">
                        <h1>Maks Ignatiev</h1>
                        <p>Online</p>
                        <p>I will save you from loneliness, but I do not know how to save myself.</p>
                    </nav>
                </nav>
                <nav class="gallary">
                    <img src="../img/arrow slide.svg" onclick="left()">
                    <nav class="img">
                        <img src="../img/gallary 1.jpg">
                        <img src="../img/gallary 2.jpg">
                        <img src="../img/gallary 3.jpg">
                        <img src="../img/gallary 4.jpg">
                        <img src="../img/image1.png">
                        <img src="../img/image2.png">
                    </nav>
                    <img src="../img/arrow slide.svg">
                </nav>
            </nav>
        </div>
        <div class="edit_profile">
            <nav class="btn">
                <p>Back</p>
            </nav>
            <form action="" method="POST">
                <input type="text" placeholder="Username:">
                <input type="text" placeholder="Status:">
                <input type="text" placeholder="Hometown:">
                <input type="text" placeholder="Languages:">
                <input type="text" placeholder="Educational institution:">
                <input type="submit" value="Save">
            </form>
        </div>
    </main>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
